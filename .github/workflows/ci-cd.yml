
name: HelloVibe CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Terraform format
        run: terraform fmt -check -recursive terraform
   
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: Run Checkov security scan
        run: |
          python -m pip install checkov
          checkov -d terraform --soft-fail

      - name: Validate Azure dev
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Azure prod
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false
          terraform validate

      - name: Test production Terraform
        working-directory: terraform/environments/prod
        run: terraform test

      - name: Validate Kubernetes Terraform
        working-directory: terraform/kubernetes
        run: |
          terraform init -backend=false
          terraform validate

  app-checks:
    name: Application checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      
      - name: Build Docker image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t hellovibe-api:${{ github.sha }} ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hellovibe-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"