name: HelloVibe CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  terraform-checks:
    name: Terraform checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Terraform format
        run: terraform fmt -check -recursive terraform

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: Run Checkov security scan
        run: |
          python -m pip install checkov
          checkov -d terraform --soft-fail

      - name: Validate Azure dev
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Azure prod
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false
          terraform validate

      - name: Test production Terraform
        working-directory: terraform/environments/prod
        run: terraform test

      - name: Validate Kubernetes Terraform
        working-directory: terraform/kubernetes
        run: |
          terraform init -backend=false
          terraform validate

  app-checks:
    name: Application checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Build Docker image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t hellovibe-api:${{ github.sha }} ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hellovibe-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish-image:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [terraform-checks, app-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -t "${{ steps.image.outputs.name }}:${{ github.sha }}" \
            ./app

      - name: Scan image before publishing
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image to GHCR
        run: docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"


  deploy-dev:
    name: Deploy to Dev on kind
    runs-on: ubuntu-latest
    needs: [publish-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull "${{ steps.image.outputs.name }}:${{ github.sha }}"

      - name: Create temporary Kubernetes cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind

      - name: Load image into kind
        run: kind load docker-image "${{ steps.image.outputs.name }}:${{ github.sha }}"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy to dev
        run: |
          helm upgrade --install hellovibe-dev ./k8s/chart \
            --namespace dev --create-namespace \
            --set-string image.repository="${{ steps.image.outputs.name }}" \
            --set-string image.tag="${{ github.sha }}" \
            --set image.pullPolicy=IfNotPresent \
            --set replicaCount=1 \
            --set autoscaling.enabled=false

          kubectl rollout status deployment/hellovibe-dev \
            -n dev --timeout=180s

      - name: Smoke test dev
        run: |
          kubectl port-forward -n dev svc/hellovibe-dev 18080:8080 \
            > /tmp/dev-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/version | tee /tmp/version.json
          grep -F "${{ github.sha }}" /tmp/version.json


  
  deploy-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find previous successful production release
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-cd.yml',
              branch: 'main',
              status: 'success',
              per_page: 20
            });

            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;

              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });

              const artifact = result.data.artifacts.find(
                item => item.name === 'production-sha' && !item.expired
              );

              if (artifact) {
                core.setOutput('run_id', String(run.id));
                core.info(`Previous production release found in run ${run.id}`);
                return;
              }
            }

            core.setOutput('run_id', '');
            core.info('No previous production release found. This may be the first deployment.');

      - name: Download previous production SHA
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: production-sha
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./previous-production

      - name: Read previous production SHA
        id: previous-sha
        shell: bash
        run: |
          if [ -f ./previous-production/production-sha.txt ]; then
            SHA=$(tr -d '\r\n' < ./previous-production/production-sha.txt)
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "Previous production SHA: $SHA"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "No previous production SHA is available."
          fi

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull current image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          CURRENT_SHA: ${{ github.sha }}
        run: docker pull "$IMAGE:$CURRENT_SHA"

      - name: Pull previous production image
        if: steps.previous-sha.outputs.sha != ''
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          PREVIOUS_SHA: ${{ steps.previous-sha.outputs.sha }}
        run: docker pull "$IMAGE:$PREVIOUS_SHA"

      - name: Create temporary Kubernetes cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind

      - name: Load current image into kind
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          CURRENT_SHA: ${{ github.sha }}
        run: kind load docker-image "$IMAGE:$CURRENT_SHA"

      - name: Load previous image into kind
        if: steps.previous-sha.outputs.sha != ''
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          PREVIOUS_SHA: ${{ steps.previous-sha.outputs.sha }}
        run: kind load docker-image "$IMAGE:$PREVIOUS_SHA"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install previous release as rollback baseline
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          CURRENT_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ steps.previous-sha.outputs.sha }}
        shell: bash
        run: |
          BASELINE_SHA="$CURRENT_SHA"

          if [ -n "$PREVIOUS_SHA" ]; then
            BASELINE_SHA="$PREVIOUS_SHA"
            echo "Using previous production image as rollback baseline."
          else
            echo "First deployment: no previous version exists to roll back to."
          fi

          helm upgrade --install hellovibe-prod ./k8s/chart \
            --namespace production --create-namespace \
            --set-string image.repository="$IMAGE" \
            --set-string image.tag="$BASELINE_SHA" \
            --set image.pullPolicy=IfNotPresent \
            --set replicaCount=2 \
            --set autoscaling.enabled=false

          kubectl rollout status deployment/hellovibe-prod \
            -n production --timeout=180s

      - name: Promote current image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          helm upgrade hellovibe-prod ./k8s/chart \
            --namespace production \
            --set-string image.repository="$IMAGE" \
            --set-string image.tag="$CURRENT_SHA" \
            --set image.pullPolicy=IfNotPresent \
            --set replicaCount=2 \
            --set autoscaling.enabled=false

          kubectl rollout status deployment/hellovibe-prod \
            -n production --timeout=180s

      - name: Production smoke test and rollback
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          CURRENT_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ steps.previous-sha.outputs.sha }}
        run: |
          SMOKE_OK=true

          kubectl port-forward -n production svc/hellovibe-prod 18081:8080 \
            > /tmp/prod-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT

          READY=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/intentional-test-failure >/dev/null; then
              READY=true
              break
            fi
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "Production health check failed."
            SMOKE_OK=false
          else
            if ! curl -fsS http://127.0.0.1:18081/version \
              | tee /tmp/prod-version.json \
              | grep -F "$CURRENT_SHA"; then
              echo "Production version check failed."
              SMOKE_OK=false
            fi
          fi

          if [ "$SMOKE_OK" != "true" ]; then
            if [ -n "$PREVIOUS_SHA" ]; then
              echo "Rolling back to previous production image: $PREVIOUS_SHA"

              helm rollback hellovibe-prod 1 \
                -n production --wait --timeout=180s

              kubectl rollout status deployment/hellovibe-prod \
                -n production --timeout=180s

              ACTUAL_IMAGE=$(kubectl get deployment hellovibe-prod \
                -n production \
                -o jsonpath='{.spec.template.spec.containers[0].image}')

              EXPECTED_IMAGE="$IMAGE:$PREVIOUS_SHA"

              if [ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]; then
                echo "Rollback verification failed."
                echo "Expected: $EXPECTED_IMAGE"
                echo "Actual: $ACTUAL_IMAGE"
                exit 1
              fi

              echo "Rollback verified: $ACTUAL_IMAGE"
            else
              echo "No previous successful production release exists."
              echo "Automatic rollback is not possible on the initial release."
            fi

            exit 1
          fi

          echo "Production smoke test passed."

      - name: Record successful production SHA
        if: success()
        run: echo "${{ github.sha }}" > production-sha.txt

      - name: Save successful production SHA for next release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: production-sha
          path: production-sha.txt
          retention-days: 90
          if-no-files-found: error
